  J'ai notamment connu un léger ralentissement temporaire de l’activité, auquel se sont ajoutés des délais de règlement clients de plus en plus longs et des impayés. Par ailleurs, certaines commandes sont aujourd’hui prêtes mais ne peuvent pas encore être livrées en raison du décalage de plusieurs chantiers. Ces marchandises ont néanmoins été financées par l’entreprise et représentent donc une trésorerie actuellement immobilisée.
  La situation commerciale est aujourd’hui nettement plus favorable. L’activité a repris et notre chiffre d’affaires est actuellement en progression d’environ 17 % par rapport à l’année précédente. Le travail et les commandes sont présents ; la difficulté que je rencontre est donc principalement liée au décalage de trésorerie accumulé et aux retards de règlement, qui m'empêchent de retrouver une situation financière saine malgré cette reprise.
  Mon objectif est aujourd’hui d’obtenir un financement me permettant de régulariser ma dette de TVA et de repartir sur des bases assainies. Ce financement me donnerait la possibilité de sortir de cette tension de trésorerie et de me concentrer pleinement sur le développement de l’activité, dont la dynamique actuelle est positive.
  Je souhaite donc solliciter votre accompagnement afin d’étudier les solutions qui pourraient être mises en place avec mes partenaires bancaires pour financer ce besoin et permettre à l’entreprise de poursuivre son activité dans de bonnes conditions.
  Je reste naturellement à votre disposition pour vous transmettre l’ensemble des éléments nécessaires à l’étude de ma situation : bilans, situation comptable récente, évolution du chiffre d’affaires, état de la dette fiscale, carnet de commandes et prévisionnel de trésorerie.
  Je vous remercie par avance pour l’attention portée à ma demande et reste disponible pour échanger avec vous rapidement.
