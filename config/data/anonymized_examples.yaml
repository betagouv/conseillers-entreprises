'351845': |-
  Bonjour,
  Activité : NÉGOCE DE BOIS ET MATÉRIELS DE CONSTRUCTIONS
  Origine Problèmes :
  L’entreprise a changé de propriétaire en 2017 avec un chiffre d'affaires initial de 2,7 M€. L'évolution de l'activité a été marquée par une croissance jusqu'à 3,5 M€, suivie d'une période de décroissance sur les trois dernières années, conséquence directe de la crise qui secoue le secteur du BTP. Face à ces turbulences, la société a initié une stratégie de diversification il y a trois ans, se traduisant par le lancement d'une marque de meubles destinée aux particuliers.
  La baisse significative du chiffre d'affaires de l’entreprise, de l'ordre de 30%, peut être facilement illustrée par l'exemple éloquent de notre client principal. Les commandes de ce dernier ont chuté de manière vertigineuse, passant d'un volume annuel oscillant entre 420 K€ et 550 K€ à moins de 37 K€ l'année dernière.
  Les perspectives à venir sont encourageantes, notamment liées aux projets d'envergure prévus dans le département, représentant potentiellement un marché de 22 M€ de gros œuvres sur la prochaine décennie.
  De nombreuses mesures de restructuration et d’économies ont été entreprises depuis le début de l'année dernière. Avec notamment des économies récurrentes de 92 K€ sur les charges fixes, effectives à compter du 1er janvier de cette année, principalement générées par des changements de logiciels.
  Reprise des paiements des cotisations sociales en part patronales après 2 mois de paiement de la part salariale (obligatoire)
  Nous avons sollicité notre banque qui au lieu de nous soutenir nous a retiré le découvert qu'elle avait autorisé et que nous n'avions jamais utilisé.
