  - title: Fabrication de maroquinerie - Crédit d’impôt recherche (CIR)
    text: |-
      Bonjour,
      Mon entreprise a une activité de fabrication de maroquinerie. Je me permets de vous contacter.
      Nous souhaitons actuellement nous renseigner sur les modalités d’éligibilité et d’accompagnement dans le cadre d’une candidature au crédit d’impôt recherche (CIR). Dans ce contexte, nous serions intéressés par un échange avec un conseiller afin d’évaluer la pertinence de notre démarche et d’être accompagnés dans la structuration de notre dossier.
      Pourriez-vous nous indiquer les prochaines étapes ainsi que vos modalités d’intervention ?
      Je reste bien entendu à votre disposition pour vous fournir tout élément complémentaire sur nos activités.
      Dans l’attente de votre retour,
      Bien cordialement
  - title: Traiteur - Mécénat
    text: |-
      Bonjour,
      Mon entreprise a une activité de traiteur.
      Elle existe depuis 5 ans.
      Je souhaiterais échanger avec vous sur le système de mécénat, car une association avec qui je vais travailler m’a demandé la possibilité de passer une partie de la prestation en système de mécénat. Mais comment cela se passe-t-il, sachant que je suis en micro-entreprise ?
      Merci d’avance pour votre appel.
  - title: Déménageur - Mécénat et dons en nature
    text: |-
      Bonjour,
      Mon entreprise a une activité de services de déménagement.
      Je vous contacte car je souhaite des éclaircissements sur le don et le mécénat en nature à des associations reconnues d’utilité publique.
      En particulier, j’ai besoin de savoir si le don de mobilier ou d’électroménager à ces associations peut faire l’objet d’une réduction d’impôt, et sous quelles conditions.
      Enfin, comment calculer la valeur des produits donnés s’ils ne sont pas issus de la production de l’entreprise ?
      Merci d’avance pour votre appel.
  - title: Arts du spectacle vivant - Taux de TVA applicables
    text: |-
      Bonjour,
      Mon entreprise a une activité d’arts du spectacle vivant.
      Elle existe depuis 2009.
      Je souhaiterais des conseils sur les taux de TVA à appliquer en fonction des différentes activités ou formulations de présentations (spectacles, concerts, co-réalisation, co-productions, enseignement dans une salle associative, enseignement au domicile de l’élève, ateliers participatifs et spectacles participatifs (coaching vocal à une chorale avant un concert), spectacles chorégraphiques, présence de moyens de sonorisation fournis par les artistes, consommation ou non de repas ou boissons, concert dans un lieu de culte, accompagnement d’un service religieux, concert dans un château, accompagnement musical d’un vin d’honneur pour un mariage, évènement annoncé publiquement, évènement privé, concert au cours d’une exposition artistique, présence de compositions ou arrangements personnalisés, captation vidéo ou audio).
      Frais de déplacements par voiture ou par train.
      Les 140 représentations sont-elles par an, ou depuis le début de l’activité ? Si le répertoire change, le nombre de représentations est-il réinitialisé ?
      Merci d’avance pour votre appel.
  - title: Débit de boissons - Taux de TVA applicables
    text: |-
      Bonjour,
      Mon entreprise a une activité de débit de boissons.
      Je souhaiterais des conseils sur le taux de TVA applicable sur des bouteilles de boissons non alcoolisées (Badoit, Evian, Coca…), consignées ou non.
      À la lecture des informations concernant la TVA, on m’a expliqué dans le cadre de mon permis d’exploitation que le taux de TVA à appliquer est bien le taux réduit à 5,5 %.
      Pouvez-vous me confirmer cette information ?
      Merci d’avance pour votre appel.
  - title: Négoce de pièces automobiles - Fiscalité des dividendes
    text: |-
      Bonjour,
      Mon entreprise a une activité de négoce de pièces et accessoires dans le secteur de l’automobile.
