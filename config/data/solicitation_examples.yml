tresorerie:
  cases:
  - title: Entreprise de peinture
    text: |-
      Bonjour,
      Mon entreprise a une activité de peinture.
      Concernant l’origine des problèmes, je rencontre aujourd’hui des difficultés car j’ai des dettes Urssaf qui sont passées chez un huissier, il a fait une saisie sur mes comptes bancaires en vain car je n’ai pas de revenus en ce moment. L’huissier souhaite que je rembourse 32 000 € en 8 mois ce qui m’est impossible. J’ai un virement mensuel récurrent en place d’un montant de 117 €, en septembre je n’ai pas pu honorer ce virement, il y a quelque temps je versais 434 € mais je ne pouvais plus donc j’ai réduit à 97 €.
      Merci beaucoup pour votre appel.
  - title: Entreprise de restauration rapide
    text: |-
      Bonjour,
      Mon entreprise a une activité de restauration.
      Je rencontre aujourd’hui des difficultés suite aux augmentations de la matière première dues au prix du gasoil actuel, ça a impacté mon activité. J’ai du mal à tenir debout, je peux pas augmenter mes prix de vente car il y a la concurrence juste à côté dans mon magasin, j’ai une tréso très négative, j’ai beaucoup de charges, j’essaye de tenir bon mais ça devient très difficile.
      Merci.
  - title: Entreprise de maçonnerie et couverture (BTP)
    text: |-
      Bonjour,
      Mon entreprise a une activité de maçonnerie couverture.
      Concernant l’origine des problèmes, je rencontre aujourd’hui des difficultés car j’ai un client qui me doit environ 12 000 euros et qui ne me les donnera jamais.
      Concernant mes cotisations sociales (Urssaf) et fiscales (TVA, impôts...), ma situation est en retard et je dois environ 7 700 euros d’Urssaf.
      L’état de la relation avec ma banque est bloqué vu que j’ai un crédit camion.
      Merci beaucoup pour votre appel.
  - title: Entreprise de loisirs
    text: |-
      Bonjour,
      Mon entreprise a une activité de parc de loisirs (trampolines, laser game et karaoké).
      Concernant l’origine des problèmes, je rencontre aujourd’hui des difficultés car l’été a été particulièrement mauvais et les PGE ont été remboursés trop rapidement.
      Concernant mes cotisations sociales (Urssaf) et fiscales (TVA, impôts...), ma situation est sans retard. Seul retard à ce jour : le bailleur.
      L’état de la relation avec ma banque est bon.
      Merci beaucoup pour votre appel.
  - title: Entreprise de nettoyage
    text: |-
      Bonjour,
      Mon entreprise a une activité de nettoyage des bâtiments et des chantiers de BTP.
      Concernant l’origine des problèmes, je rencontre aujourd’hui des difficultés car j’ai perdu mon principal client au mois de novembre dernier et malgré mes efforts je n’ai plus du tout facturé depuis plusieurs mois.
      Concernant mes cotisations sociales (Urssaf) et fiscales (TVA, impôts...), ma situation est compliquée et j’ai dû faire appel à un médiateur pour arranger la situation relative à une dette inexistante, réclamée suite à un mauvais calcul.
      L’état de la relation avec ma banque est ok, mais les frais s’accumulent.
      Merci beaucoup pour votre appel.
  - title: Commerce alimentaire
    text: |-
      Bonjour,
      Mon entreprise a une activité d’alimentation générale/épicerie de proximité.
      Je rencontre aujourd’hui des difficultés car des décès et/ou hospitalisations de clients importants ont entraîné une baisse d’activité et des problèmes de trésorerie quasi insurmontables.
      Concernant mes cotisations sociales (Urssaf) et fiscales (TVA, impôts...), ma situation est à jour, mais les prochaines échéances seront problématiques en particulier pour la CFE.
      L’état de la relation avec ma banque est sans problème particulier.
  - title: Entreprise de transports routiers de fret interurbains
    text: |-
      Bonjour,
      Mon entreprise a une activité de transport.
      Concernant l’origine des problèmes, je rencontre aujourd’hui des difficultés car je dois absolument baisser le coût de mes véhicules en passant par du crédit-bail ou classique mais les banques sont frileuses malgré le dossier prouvant une économie réelle.
      Concernant mes cotisations sociales (Urssaf) et fiscales (TVA, impôts...), ma situation est à jour.
      L’état de la relation avec ma banque est bon.
      Merci beaucoup pour votre appel.
  - title: Entreprise de dépollution et gestion des déchets
    text: |-
      Bonjour,
      Mon entreprise a une activité de fournir les ports en équipements anti-pollution et gérer la déconstruction de bateaux.
      Concernant l’origine des problèmes, je rencontre aujourd’hui des difficultés car ma trésorerie ne me permet pas de faire face aux paiements (URSSAF, créanciers...).
      Concernant mes cotisations sociales (Urssaf) et fiscales (TVA, impôts...), ma situation est en retard de paiement.
      L’état de la relation avec ma banque est bon car banque en ligne.
      Merci beaucoup pour votre appel.
  - title: Entreprise d’ingénierie et études techniques
    text: |-
      Bonjour,
      Mon entreprise a une activité de construction ossature bois et de maîtrise d’œuvre.
      Concernant l’origine des problèmes, je rencontre aujourd’hui des difficultés car le marché de la construction neuve est en forte baisse depuis plusieurs mois maintenant suite à des coûts de construction en hausse, nos clients sont bloqués faute de pouvoir accéder à leur prêt.
      Je me suis diversifié en 2016 sur le marché de la rénovation énergétique globale mais les nombreux changements de réglementation sont venus fortement freiner et perturber la dynamique enclenchée puisque les clients sont beaucoup moins accompagnés financièrement par prime rénov sans compter les délais et procédures administratives dissuasives et chronophages pour l’entreprise.
      En 2019, nous nous sommes également diversifiés sur les ombrières bois photovoltaïques, ce qui a complexifié notre organisation. Sur cette activité, nous devions obtenir 3 commandes d’un de nos clients récurrents mais ce dernier a préféré décaler des commandes pour basculer sur le budget de l’année prochaine ce qui nous fait un manque à gagner et un trou dans notre planning.
      Enfin nous avons également rencontré des problèmes de gestion de salariés et dû nous réorganiser en interne depuis 1 an maintenant.
      Concernant mes cotisations sociales (Urssaf) et fiscales (TVA, impôts...), ma situation devient compliquée puisque la TVA du mois d’août a été rejetée par la banque faute de provision suffisante.
      L’état de notre trésorerie ne me permet plus de faire face aux échéances qui arrivent. J’ai demandé un prêt de 35 000 € à ma banque pour soutenir notre trésorerie, mais je reste en attente de leur retour.
      Merci beaucoup pour votre appel.
  - title: Commerce de détail
    text: |-
      Madame, Monsieur,
      Je me permets de solliciter l’accompagnement de la Médiation du crédit concernant la situation de trésorerie de mon entreprise.
      Je fais actuellement face à une dette fiscale constituée exclusivement de TVA. Ce montant s’est accumulé progressivement au cours des derniers mois, sous l’effet de plusieurs facteurs qui ont pesé simultanément sur ma trésorerie.
      J’ai notamment connu un léger ralentissement temporaire de l’activité, auquel se sont ajoutés des délais de règlement clients de plus en plus longs et des impayés. Par ailleurs, certaines commandes sont aujourd’hui prêtes mais ne peuvent pas encore être livrées en raison du décalage de plusieurs chantiers. Ces marchandises ont néanmoins été financées par l’entreprise et représentent donc une trésorerie actuellement immobilisée.
      La situation commerciale est aujourd’hui nettement plus favorable. L’activité a repris et notre chiffre d’affaires est actuellement en progression d’environ 17 % par rapport à l’année précédente. Le travail et les commandes sont présents ; la difficulté que je rencontre est donc principalement liée au décalage de trésorerie accumulé et aux retards de règlement, qui m’empêchent de retrouver une situation financière saine malgré cette reprise.
      Mon objectif est aujourd’hui d’obtenir un financement me permettant de régulariser ma dette de TVA et de repartir sur des bases assainies. Ce financement me donnerait la possibilité de sortir de cette tension de trésorerie et de me concentrer pleinement sur le développement de l’activité, dont la dynamique actuelle est positive.
      Je souhaite donc solliciter votre accompagnement afin d’étudier les solutions qui pourraient être mises en place avec mes partenaires bancaires pour financer ce besoin et permettre à l’entreprise de poursuivre son activité dans de bonnes conditions.
      Je reste naturellement à votre disposition pour vous transmettre l’ensemble des éléments nécessaires à l’étude de ma situation : bilans, situation comptable récente, évolution du chiffre d’affaires, état de la dette fiscale, carnet de commandes et prévisionnel de trésorerie.
      Je vous remercie par avance pour l’attention portée à ma demande et reste disponible pour échanger avec vous rapidement.
      Cordialement
  - title: Salle d’escalade
    text: |-
      Bonjour,
      Mon entreprise est une salle d’escalade, bar et restaurant.
      Concernant l’origine des problèmes, je rencontre aujourd’hui des difficultés causées par de multiples causes :
      - les activités de loisirs sont particulièrement touchées par la baisse du pouvoir d’achat des Français,
      - l’été est toujours une période creuse, sauf que les canicules successives ainsi que le très beau temps qui perdure avec très peu de jours de pluie, réduisent la fréquentation de nos clients,
      - les hausses de l’électricité, taxes locales, nous touchent beaucoup.
      Concernant mes cotisations sociales (Urssaf) et fiscales (TVA, impôts...), ma situation est débitrice depuis quelques mois.
      L’état de la relation avec ma banque est difficile, elle ne m’accompagne pas dans mes demandes de gel de remboursement d’emprunt.
      Merci.
  - title: Entreprise d’accueil de jeunes enfants
    text: |-
      Bonjour,
      Mon entreprise a une activité d’accueil de jeunes enfants. Suite à une fermeture subite, elle fait l’objet aujourd’hui d’un redressement. Je dois relancer mon activité, mais je peine suite à une absence de fonds de roulement (BFR non couvert).
      Concernant l’origine des problèmes, je rencontre aujourd’hui des difficultés car j’ai perdu ma clientèle, qu’il me faut reconquérir.
      Concernant mes cotisations sociales (Urssaf) et fiscales (TVA, impôts...), ma situation est dans l’orange, j’ai des dettes résultant de la période de fermeture.
      L’état de la relation avec ma banque est bloqué.
      Merci beaucoup pour votre appel.
  - title: Commerce de détail et fabrication d’autres produits chimiques
    text: |-
      Bonjour,
      Mon entreprise a une activité de vente de cigarettes électroniques et de fabrication de e-liquides.
      Concernant l’origine des problèmes, je rencontre aujourd’hui des difficultés car j’ai des charges salariales trop importantes et des problèmes de trésorerie.
      Concernant mes cotisations sociales (Urssaf) et fiscales (TVA, impôts...), ma situation est correcte car à ce jour, j’ai tout payé.
      L’état de la relation avec ma banque est plutôt correct mais un nouveau financement est compromis car mon bilan 2025 n’est pas bon.
      Merci beaucoup pour votre appel.
  - title: Commerce de détail de fleurs, plantes, graines, engrais, animaux de compagnie et aliments pour ces animaux en magasin spécialisé
    text: |-
      Bonjour,
      Mon entreprise a une activité de 2 magasins de jardinerie ainsi qu’une activité de motoculture.
      Concernant l’origine des problèmes, je suis actuellement dans une situation financière très compliquée concernant mon activité. Je suis contrainte de fermer l’un de mes magasins, qui n’est malheureusement plus rentable et qui représente aujourd’hui une perte financière importante pour mon deuxième magasin.
      Mon activité a été fortement impactée par la conjoncture actuelle, mais également par deux années consécutives de sécheresse, qui ont eu des conséquences importantes sur mon chiffre d’affaires et sur l’équilibre financier de mon entreprise. Malgré mes efforts pour maintenir le magasin et trouver des solutions, la situation ne s’est pas suffisamment améliorée et continuer ainsi risquerait d’aggraver encore les pertes.
      J’ai donc pris la décision de fermer ce magasin afin de stopper cette perte et de pouvoir préserver au mieux la suite de mon deuxième magasin.
      La difficulté à laquelle je suis confrontée aujourd’hui est que je n’ai malheureusement pas la trésorerie nécessaire pour assumer les coûts liés à cette fermeture, notamment le licenciement économique de mon employé pour lequel il me faudrait un financement que je n’obtiens pas. C’est une situation particulièrement préoccupante pour moi, car je sais que je dois prendre les mesures nécessaires pour arrêter les pertes, mais je n’ai actuellement pas les moyens financiers de faire face à ces charges.
      Concernant mes cotisations sociales (Urssaf) et fiscales (TVA, impôts...), je suis en train de demander des échéanciers de paiement de cotisations et impôts.
      L’état de la relation avec ma banque est : ils entendent mais sont inquiets. La société dispose d’un découvert bancaire déjà utilisé en partie, nous avons un prêt garanti par la BPI dont les échéances vont être repoussées et nous avons également un crédit vendeur restant suite au rachat de la société auprès des cédants.
      Merci beaucoup pour votre appel.
  - title: Agence de communication & marketing
    text: |-
      Bonjour,
      Mon entreprise a une activité d’agence de communication & marketing depuis 2005.
      Concernant l’origine des problèmes, je rencontre aujourd’hui des difficultés car notre modèle nous permet de facturer 1/3 de notre CA le 1er janvier de chaque année, sauf que cette année a été particulière. Nous sortons d’une phase de restructuration de la société (organisation, RH) avec des coûts extraordinaires.
      Enfin, nos 2 partenaires bancaires n’acceptent plus de découvert pour gérer ce petit trou de trésorerie « temporaire » (novembre > janvier).
      Concernant mes cotisations sociales (Urssaf) et fiscales (TVA, impôts...), ma situation est rétablie.
      L’état de la relation avec ma banque est donc mitigé car du côté de notre agence, tout est en ordre, nos échéances de prêt sont à jour. Mais pour autant, ils ne veulent pas nous accorder cette soupape temporaire qui n’a pas pour but de se reproduire l’année prochaine. Nous avons fait ce qu’il faut cette année pour ça en tout cas.
      Merci beaucoup pour votre appel.
  - title: Entreprise de vente à distance sur catalogue spécialisé
    text: |-
      Bonjour,
      Mon entreprise a une activité de vente en ligne d’accessoires pour cyclistes depuis 2014.
      Fabrication locale et 100 % française.
      Concernant l’origine des problèmes, je rencontre aujourd’hui des difficultés car ma trésorerie est très basse et j’ai des dettes auprès de mes 2 fournisseurs principaux (12 500 € environ). J’ai contacté chacun d’eux à ce jour pour leur demander un délai/étalement des paiements.
      L’activité recule de 18 % cette année par rapport à l’an passé. Cependant je viens de démarrer une collaboration avec un prestataire freelance en gestion pour m’aider à y voir plus clair et trouver des solutions.
      Concernant mes cotisations sociales (Urssaf) et fiscales (TVA, impôts...), ma situation est : j’ai contacté mon expert-comptable mais les démarches ne valent pas le coup car les cotisations sociales sont vraiment moindres, idem pour la TVA actuellement.
      L’état de la relation avec ma banque est bon, ils m’ont accepté un découvert autorisé de 8 200 € en janvier 2026.
      Avez-vous des solutions à me proposer pour avancer plus sereinement ? Des idées d’aides ou de financements/subventions.
      Merci beaucoup pour votre appel.
  - title: Entreprise de production d’électricité
    text: |-
      Bonjour,
      Mon entreprise a une activité de production d’électricité renouvelable et fourniture d’énergie aux voitures électriques.
      Concernant l’origine des problèmes, je rencontre aujourd’hui des difficultés car mes banques refusent de financer deux de mes projets, projet à la rentabilité sécurisée par une obligation d’achat, la BPI accompagne ma société holding et est prête à garantir le dossier.
      Concernant mes cotisations sociales (Urssaf) et fiscales (TVA, impôts...), ma situation est à jour.
      L’état de la relation avec ma banque est cordial avec mes chargés d’affaires mais je ne comprends pas les décisions de leurs services engagements.
      Merci beaucoup pour votre appel.
      Mes projets cochent toutes les cases de la transition énergétique et sont rentables mais si les banques coupent la création monétaire à destination de ce type de projet la transition est morte en France.
      Je tiens à préciser que mon entreprise a une éthique exemplaire et développe des activités de production d’énergie renouvelable, de protection de la biodiversité et possède un bilan carbone négatif (mes activités compensent plus qu’elles n’émettent de carbone).
  - title: Boulangerie - pâtisserie
    text: |-
      Bonjour,
      Mon entreprise a une activité de boulangerie pâtisserie.
      Concernant l’origine des problèmes, je rencontre aujourd’hui des difficultés car je viens de me mettre en RJ et la mandataire m’a informé qu’une aide est possible pour payer les frais mandataire.
      Concernant mes cotisations sociales (Urssaf) et fiscales (TVA, impôts...), ma situation est URSSAF en retard de paiement.
      L’état de la relation avec ma banque est aucun dialogue, le compte RJ vient d’être ouvert dans une autre banque.
      Merci beaucoup pour votre appel.
  - title: Entreprise de fabrication de charpentes et d’autres menuiseries
    text: |-
      Bonjour,
      Activité : négoce de bois et matériels de constructions.
      Origine problèmes :
      L’entreprise a changé de propriétaire en 2017 avec un chiffre d’affaires initial de 2,7 M€.
      L’évolution de l’activité a été marquée par une croissance jusqu’à 3,5 M€, suivie d’une période de décroissance sur les trois dernières années, conséquence directe de la crise qui secoue le secteur du BTP. Face à ces turbulences, la société a initié une stratégie de diversification il y a trois ans, se traduisant par le lancement d’une marque de meubles destinée aux particuliers.
      La baisse significative du chiffre d’affaires de l’entreprise, de l’ordre de 30 %, peut être facilement illustrée par l’exemple éloquent de notre client principal. Les commandes de ce dernier ont chuté de manière vertigineuse, passant d’un volume annuel oscillant entre 420 K€ et 550 K€ à moins de 37 K€ l’année dernière.
      Les perspectives à venir sont encourageantes, notamment liées aux projets d’envergure prévus dans le département, représentant potentiellement un marché de 22 M€ de gros œuvre sur la prochaine décennie.
      De nombreuses mesures de restructuration et d’économies ont été entreprises depuis le début de l’année dernière. Avec notamment des économies récurrentes de 92 K€ sur les charges fixes, effectives à compter du 1er janvier de cette année, principalement générées par des changements de logiciels.
      Reprise des paiements des cotisations sociales en part patronale après 2 mois de paiement de la part salariale (obligatoire).
      Nous avons sollicité notre banque qui au lieu de nous soutenir nous a retiré le découvert qu’elle avait autorisé et que nous n’avions jamais utilisé.
  - title: Entreprise de transport sanitaire (ambulances)
    text: |-
      Bonjour,
      Mon entreprise a une activité de transport sanitaire en ambulance.
      Concernant l’origine des problèmes, je rencontre aujourd’hui des difficultés car je n’ai pas de trésorerie, je n’arrive pas à la consolider car je dépends des délais de règlement des établissements pour lesquels j’effectue des transports.
      Concernant mes cotisations sociales (Urssaf) et fiscales (TVA, impôts...), ma situation est jusque-là à jour mais je crains à partir de ce mois d’octobre de ne pouvoir honorer les charges à venir.
      L’état de la relation avec ma banque est froid, j’ai une ligne de découvert permanente mais plus aucun lien de confiance et si cette ligne venait à être suspendue ou réduite comme elle l’a été en début d’année, je serais en cessation de paiement immédiate. Malgré mes demandes d’un prêt flash carburant à plusieurs reprises je n’ai eu que des refus, et pour le prêt booster je n’ai malheureusement aucun crédit en cours. Je dois remplacer mon ambulance en panne et je dois passer par un crédit-bail auprès du vendeur car la banque ne me financera pas. Soit j’arrive à obtenir un financement de trésorerie, soit je dois songer à une liquidation de mon entreprise malgré les commandes et clients présents.
  - title: Commerce de gros (commerce interentreprises) d’habillement et de chaussures
    text: |-
      Bonjour,
      Mon entreprise a une activité de franchise prêt-à-porter.
      Concernant l’origine des problèmes, je rencontre aujourd’hui des difficultés car je ne peux pas honorer mes crédits.
      Concernant mes cotisations sociales (Urssaf) et fiscales (TVA, impôts...), ma situation est pas très bien concernant la TVA.
      L’état de la relation avec ma banque est compliqué, il ne souhaite pas me restructurer alors que financièrement sur un crédit de 9 ans je pourrais tout honorer au vu de mon chiffre d’affaires qui se maintient tous les ans.
      Merci beaucoup pour votre appel.
  - title: Entreprise de production de films et de programmes pour la télévision
    text: |-
      Bonjour,
      Mon entreprise a une activité de production audiovisuelle.
      Concernant l’origine des problèmes, je rencontre aujourd’hui des difficultés car un co-financeur ne s’est finalement pas engagé dans le financement d’un projet déjà en cours, nous mettant aujourd’hui en grande difficulté dans notre développement.
      Concernant mes cotisations sociales (Urssaf) et fiscales (TVA, impôts...), ma situation est régulière.
      L’état de la relation avec ma banque est bon. Mais notre banque ne finance en aucun cas de la trésorerie ou du fonds de roulement.
      Merci beaucoup pour votre appel.
  - title: Entreprise d’installation de structures métalliques, chaudronnées et de tuyauterie
    text: |-
      Bonjour,
      Mon entreprise a une activité de préfabrication, soudure et montage tuyauterie industrielle.
      Concernant l’origine des problèmes, je rencontre aujourd’hui des difficultés car en raison d’un ralentissement du rythme de travail et de la différence entre les entrées et les sorties, les paiements sont effectués à 30 et 45 jours fin de mois, tandis que les charges sont mensuelles.
      Concernant mes cotisations sociales (Urssaf) et fiscales (TVA, impôts...), ma situation est que nous avons conclu un accord de paiement avec l’URSSAF, et avec les impôts mais nous poursuivons avec la séparation entre les entrées et les sorties.
      L’état de la relation avec ma banque est, la situation avec la banque commence à devenir délicate ; on exige désormais des engagements de la part des dirigeants et des associés pour pouvoir obtenir le financement.
      Merci beaucoup pour votre appel.
  - title: Entreprise de services à la personne
    text: |-
      Bonjour,
      Concernant l’origine des problèmes, je rencontre aujourd’hui des difficultés car j’ai des soucis de santé qui se sont fortement aggravés.
      J’ai une reconnaissance MDPH à 75 % à vie et la CPAM vient de m’accorder une invalidité cette année de grade 2 avec incapacité totale de travail.
      Concernant mes cotisations sociales (Urssaf) et fiscales (TVA, impôts...), ma situation est de dette de rétroactivité caisse retraite demandée par l’Urssaf.
      Je n’avais aucune caisse retraite lors de mon affiliation du début de mon activité il y a 20 ans.
      L’Urssaf a décidé de fermer mon compte et d’en ouvrir un nouveau et m’a donc réclamé une rétroactivité sur ces deux dernières années qui me crée une dette que je n’avais pas au jour d’aujourd’hui.
      Je me vois contrainte de prendre la décision de clôturer mon activité en fin d’année sachant que je dois faire 6 mois de préavis avec ma reconnaissance d’invalidité grade 2 pour mon bail commercial.
      L’état de la relation avec ma banque est normal.
      Merci beaucoup pour votre appel.
  - title: Entreprise de formation et de conseil pour les affaires
    text: |-
      Bonjour,
      Mon entreprise a une activité de formation, accompagnement des organismes de formation et conseil en entreprise.
      Concernant l’origine des problèmes, je rencontre aujourd’hui des difficultés car les nouvelles mises en place du compte CPF avec lequel je travaille principalement ont mis de nouvelles normes qui ont fragilisé mon activité. Délai de paiements, reste à charge des stagiaires, plafond des prestations. J’ai de la demande mais les délais de paiements sont trop longs.
      Concernant mes cotisations sociales (Urssaf) et fiscales (TVA, impôts...), ma situation est à jour. Aujourd’hui je n’ai pas assez de trésorerie pour me verser un salaire et payer mon prestataire, ainsi que mes charges (loyer, assurances...).
      L’état de la relation avec ma banque est bon. Elle m’a accordé un découvert et me propose la mise en place d’une Dailly pour le règlement des factures, mais ce n’est plus suffisant.
      Merci beaucoup pour votre appel.
  solutions: diagnostic, conseils, rendez-vous personnalisé, aide financière...
  title: Exemples d’entreprises accompagnées par le service sur leur problème de trésorerie
