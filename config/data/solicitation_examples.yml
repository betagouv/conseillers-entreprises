  title: Exemples d’entreprises accompagnées par le service sur leurs questions fiscales
reprendre-entreprise:
  cases:
  - title: Librairie
    text: |-
      Bonjour,
      J’aimerais reprendre une entreprise dans le secteur d’activité de la librairie.
      J’ai déjà trouvé une librairie qui cède son activité.
      Le projet comprend la reprise de l’activité par deux associés personnes physiques (51/49) dans le cadre d’une reconversion professionnelle.
      J’ai besoin d’être accompagnée sur les aides possibles pour cette reprise.
      Merci d’avance pour votre appel.
  - title: Buvette épicerie
    text: |-
      Bonjour,
      J’aimerais reprendre une entreprise dans le secteur d’activité de commerce buvette et épicerie.
      J’ai de l’expérience professionnelle dans : je suis salarié.
      Je recherche une entreprise dont le nombre de salariés est d’environ : j’ai trouvé le commerce.
      J’ai besoin d’être accompagné sur : comprendre un bail, connaître les charges, les obligations. C’est le propriétaire qui vend le fonds de commerce. Il n’y a pas de salarié.
      Merci d’avance pour votre appel.
  - title: Épicerie solidaire
    text: |-
      Bonjour,
      Mon entreprise a une activité de type « épicerie participative et solidaire ».
      J’ai pour projet de déménager dans un local plus grand (90 m²).
      Le montant du projet est de 50 000 euros (dont 45 000 euros serviront à racheter un fonds de commerce).
      J’ai besoin d’être accompagné(e) sur le montage financier et les aides éventuelles dont mon association pourrait bénéficier.
      Merci d’avance pour votre appel.
  - title: Hôtellerie
    text: |-
      Bonjour,
      J’aimerais reprendre une entreprise dans le secteur d’activité d’hôtellerie de plein air.
      J’ai de l’expérience professionnelle dans l’hôtellerie et la restauration.
      J’envisage de faire un apport de 20 000.
      J’ai besoin d’être accompagné sur demande d’aide et subventions possibles.
      Merci.
      Merci d’avance pour votre appel.
  - title: Reprise entreprise en difficulté
    text: |-
      Bonjour,
      Le coût global du projet est de 150 000.
      Mon besoin de financement (reste à financer) s’élève à 150 000.
      Concernant le soutien de ma banque, je suis en train de discuter avec elle suite au projet de reprise au tribunal de commerce, demande en cours, nous sommes les seuls associés à avoir déposé une offre de reprise.
      Merci d’avance pour votre appel.
  - title: Bail commercial
    text: |-
      Bonjour,
      Mon entreprise a une activité de coiffeur barbier.
      Son effectif est de 1 personne.
      Je souhaite récupérer le bail commercial de mon patron car j’ai créé mon entreprise.
      Merci d’avance pour votre appel.
  - title: Activité de cycles
    text: |-
      Bonjour,
      J’aimerais reprendre l’entreprise de cycles.
      Le propriétaire part en retraite et souhaite céder murs et fonds.
      J’ai de l’expérience professionnelle dans le sport, la vente de prestations. Je travaille actuellement comme chef d’atelier dans une PME.
      Les 2 salariées de l’entreprise sont parties en retraite en fin d’année.
      Je vais avoir des difficultés à avoir un apport conséquent car cette reprise est un peu inattendue. Je suis tombé « par hasard » sur l’annonce de la cession, mais le projet me correspond.
      J’ai besoin d’être accompagné sur la faisabilité de mon projet d’une part, et pouvoir connaître les différentes étapes à suivre pour mener à bien mon projet. J’ai déjà pris contact avec le cédant et obtenu une partie de ses bilans.
      Merci d’avance pour votre appel, idéalement le vendredi après-midi.
  - title: Rafting
    text: |-
      Bonjour,
      Je souhaite racheter une base de rafting, dont je connais le gérant actuel qui exerce sous le statut d’entrepreneur individuel.
      Ce projet, nous souhaitons le faire à deux ou trois, ce qui nécessite de créer un statut juridique afin de racheter le foncier (qui appartient en nom propre au gérant actuel) ainsi que le matériel qui permet de naviguer sur la rivière. Nous sommes, par ailleurs, tous entrepreneurs individuels, et nous nous demandons quel est le meilleur statut juridique à créer afin de procéder à ces achats. Actuellement nous nous sommes renseignés sur la SARL, la SAS, le GIE, la SCOP, mais il nous est compliqué de savoir ce qui est le mieux dans notre cas…
  - title: Services aux entreprises
    text: |-
      Bonjour,
      J’aimerais reprendre une entreprise rentable dans le secteur des services aux entreprises, du commerce spécialisé ou d’une activité générant des revenus récurrents. Je reste ouverte à d’autres secteurs présentant un bon potentiel.
      J’ai une expérience professionnelle dans l’entrepreneuriat, le commerce, la gestion d’activité, le développement commercial, les achats, la négociation avec les fournisseurs et l’import-export.
      Je recherche idéalement une entreprise comptant entre 1 et 5 salariés, disposant d’une clientèle établie et pouvant fonctionner sans une présence permanente du dirigeant.
      Ma zone géographique de recherche est principalement dans le Grand Est.
      J’envisage un apport personnel compris entre 15 000 € et 25 000 €, à compléter par un financement bancaire et, éventuellement, un crédit vendeur.
      J’ai besoin d’être accompagnée dans la sélection et l’analyse des entreprises, la vérification des comptes, l’évaluation du prix, la recherche de financement ainsi que le montage juridique et financier de la reprise.
      Merci d’avance pour votre appel.
  - title: La tech
    text: |-
      Bonjour,
      J’aimerais reprendre une entreprise dans le secteur d’activité du progiciel, de l’application, de la tech et des données.
      J’ai de l’expérience professionnelle dans le management de projets complexes.
      Je recherche une entreprise dont le nombre de salariés est d’environ 10 à 15 personnes.
      Mes zones géographiques de recherche sont Île-de-France, Hauts-de-France et Auvergne-Rhône-Alpes.
      J’envisage de faire un apport de (NC) accompagné par un investisseur.
      J’ai besoin d’être accompagné sur la sélection de l’entreprise à choisir.
      Merci d’avance pour votre appel.
  - title: Herboristerie
    text: |-
      Bonjour,
      Je reprends une entreprise dans le secteur d’activité de l’herboristerie et des produits naturels.
      J’ai de l’expérience professionnelle dans le domaine de la vente et de l’herboristerie.
      J’ai déjà engagé les démarches et je reprends le commerce en novembre.
      Je voudrais savoir si j’ai bien eu accès à toutes les aides proposées par la région pour la reprise d’entreprise.
      Merci d’avance pour votre appel.
  - title: Reprise familiale
    text: |-
      Bonjour,
      J’aimerais être conseillé sur les démarches de reprise d’entreprise familiale ; mon père part en retraite d’ici peu début 2027, je suis salarié de l’entreprise depuis bientôt 12 ans. Le but est que je rachète l’entreprise individuelle de mon père pour faire perdurer l’activité de boucher chevalin ambulant.
      Nous manquons de connaissance sur les démarches à faire pour faire un dossier de reprise d’entreprise, les démarches à effectuer au bon moment.
      Merci d’avance pour votre appel.
  - title: BTP
    text: |-
      Bonjour,
      J’aimerais reprendre une entreprise dans le secteur d’activité du BTP.
      J’ai de l’expérience professionnelle dans le BTP.
      Je recherche une entreprise dont le nombre de salariés est d’environ 0.
      Ma zone géographique de recherche est le Centre-Val de Loire.
      J’ai besoin d’être accompagné sur le statut.
      Merci d’avance pour votre appel.
  - title: Bar
    text: |-
      Bonjour,
      J’aimerais reprendre une entreprise, c’est un bar.
      Ma zone géographique de recherche est en Aura.
      J’ai besoin d’être accompagné sur la mise en place de l’entreprise, dont le financement et savoir si je peux bénéficier d’aides.
      Merci d’avance pour votre appel.
  - title: Restauration
    text: |-
      Bonjour,
      J’aimerais reprendre une entreprise dans le secteur d’activité de la restauration.
      J’ai de l’expérience professionnelle dans la restauration.
      J’envisage de faire un apport de 25 000.
      J’ai besoin d’être accompagné sur le financement de l’apport.
      Merci d’avance pour votre appel.
  - title: Blanchisserie
    text: |-
      J’aimerais reprendre une entreprise dans le secteur d’activité de la blanchisserie/pressing.
      J’ai de l’expérience professionnelle dans ce domaine ayant été 2 ans chef d’équipe dans une blanchisserie industrielle.
      Et 3 ans cadre d’une société de vente d’articles d’habillement et accessoires de sport depuis 3 ans.
      J’ai besoin d’être accompagné sur le financement et les démarches à suivre.
      Merci d’avance pour votre appel.
  - title: Électricité
    text: Je suis ingénieur en génie électrique, je souhaiterais prendre une entreprise qui fait dans l’électricité avec 2 ou 4 salariés pour un budget moyen inférieur à 300 000. J’ai 52 000 € d’apport, merci.
  - title: Industrie
    text: |-
      Bonjour,
      Je reprends une entreprise dans le secteur d’activité de l’industrie (affûtage d’outils/mécanique générale).
      J’ai de l’expérience professionnelle dans l’usinage, la direction industrielle.
      Le nombre de salariés est d’environ 30 salariés.
      L’entreprise est basée en Aura.
      J’ai un apport de 400 000 €, fonds propres/quasi-fonds propres.
      J’ai besoin d’être accompagné sur le financement.
      Merci d’avance pour votre appel.
  - title: Mécanique auto
    text: |-
      Bonjour,
      J’aimerais reprendre une entreprise dans le secteur d’activité de mécanique dépannage automobile.
      J’ai de l’expérience professionnelle dans la mécanique.
      Je recherche une entreprise dont le nombre de salariés est d’environ 10 salariés.
      Mais j’ai déjà trouvé l’entreprise que je veux racheter, l’entreprise de mon patron, j’ai déjà vu la banquière qui veut bien me suivre, il faut juste que je trouve un apport.
      J’envisage de faire un apport de 50 000 €.
      J’ai besoin d’être accompagné sur les démarches pour obtenir des aides pour un apport.
      Merci d’avance pour votre appel.
  - title: Reprise par un salarié de l’entreprise
    text: |-
      Bonjour,
      J’ai la possibilité de reprendre l’entreprise pour laquelle je travaille.
      J’ai de l’expérience professionnelle dans mon domaine de sûreté et sécurité incendie.
      J’ai besoin d’être accompagné sur le rachat de l’entreprise, les aides à la création et reprise d’entreprises, les prêts d’honneur.
      Merci d’avance pour votre appel.
  - title: Commerce de proximité
    text: |-
      Bonjour,
      J’envisage avec mon conjoint de reprendre un commerce de proximité dont l’activité est la vente de café (torréfaction sur place) et épicerie fine.
      Je suis en EIRL en activité de conseils en marketing, digital et e-commerce et j’ai beaucoup travaillé dans des enseignes de retail avant. Mon conjoint est actuellement en CDI et envisage de quitter son CDI pour rejoindre opérationnellement l’entreprise après 1 an environ. Nous avons déjà engagé des discussions avec le vendeur qui nous demande un prix pour le fonds de commerce qu’on souhaite faire évaluer pour savoir si nous achetons au prix de marché.
      J’ai besoin d’être accompagnée sur cette évaluation puis dans un 2e temps sur les aspects juridiques (proposition d’offre, structure de la future société, pacte d’associés... adapté au cas particulier de notre situation EIRL en place / CDI...).
      Je viens de découvrir ce service et j’espère pouvoir bénéficier d’une aide.
      Merci d’avance pour votre appel.
  - title: Contrôle technique
    text: |-
      Bonjour,
      J’aimerais reprendre une entreprise dans le secteur d’activité de l’automobile. Plus précisément la reprise d’un centre de contrôle technique.
      J’ai de l’expérience professionnelle dans l’automobile avec 23 ans d’ancienneté, diplôme de bac, mentions.
      J’ai déjà trouvé le centre. Mes démarches sont bien engagées.
      Le coût de la reprise des parts est de 230 000 €. J’ai un apport personnel de 60 000 € pour pallier les 20 % d’apport et le fonds de roulement.
      J’ai besoin d’être accompagné sur une aide supplémentaire afin de commencer l’activité dans les meilleures conditions sans m’étrangler financièrement.
      Merci d’avance pour votre appel.
  - title: Plomberie chauffage
    text: |-
      Bonjour,
      J’aimerais reprendre une entreprise dans le secteur d’activité génie climatique pompe à chaleur.
      J’ai de l’expérience professionnelle dans ce métier et j’ai déjà une entreprise depuis 10 ans.
      J’ai déjà trouvé l’entreprise, 8 salariées.
      J’envisage de faire un apport de 50k.
      J’ai besoin d’être accompagné sur la mise en place des aides si je suis éligible.
      Merci d’avance pour votre appel.
  - title: Imprimerie
    text: |-
      Bonjour,
      J’aimerais reprendre une entreprise dans le secteur d’activité de l’imprimerie.
      J’ai de l’expérience professionnelle dans le domaine de l’impression des documents sécurisés de plus de 5 ans.
      Je recherche une entreprise dont le nombre de salariés est d’environ 3 à 10.
      Ma zone géographique de recherche est libre en France, avec des préférences pour les provinces où il y a de fortes activités économiques.
      J’envisage de faire un apport de 100 000 euros à 200 000 euros en fonction de la taille et de la valeur de l’entreprise.
      J’ai besoin d’être accompagné sur les démarches, en commençant par la recherche jusqu’à conclure le marché.
      Merci d’avance pour votre appel.
  - title: Équipement de personne
    text: |-
      Bonjour,
      J’aimerais reprendre une entreprise dans le secteur d’activité de commerce d’équipement aux personnes.
      J’ai de l’expérience professionnelle dans le commerce.
      J’ai déjà l’entreprise qui ferme courant septembre car la propriétaire part en retraite. J’ai besoin d’être accompagné sur le choix de mon statut fiscal EI à l’IS ou à l’IR ? Sachant qu’auparavant il s’agissait d’un magasin de vêtements.
      Merci d’avance pour votre appel et votre aide.
  solutions: diagnostic, conseils, rendez-vous personnalisé, aide financière...
