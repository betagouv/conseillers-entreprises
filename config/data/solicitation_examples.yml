    text: |-
      Bonjour,
      Mon entreprise a une activité de voyage.
      J’ai pour projet d’aider les salariés à venir en vélo au travail.
      J’ai besoin d’être accompagné(e) sur les aides disponibles.
      Merci d’avance pour votre appel.
  - title: Prestataire informatique - Forfait mobilité durable
    text: |-
      Bonjour,
      Mon entreprise a une activité de prestataire informatique.
