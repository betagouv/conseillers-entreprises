eau:
  cases:
  - title: Concession automobile - Eaux usées et déchets
    text: |-
      Madame, Monsieur,
      Nous nous permettons de solliciter votre attention afin de vous exposer notre situation et vous soumettre une demande d’aide financière.
      Notre concession automobile doit faire face à une dépense exceptionnelle en matière de gestion des eaux usées et de gestion des déchets.
      En effet, dans le cadre d’un diagnostic réalisé par une Agglo en décembre 2025, notre établissement a été mis en demeure de se mettre en conformité avec la réglementation en vigueur concernant :
      La gestion des eaux usées non domestiques (réseau de collecte et séparateur d’hydrocarbures non conformes).
      Le stockage des produits dangereux (lubrifiants, liquides de frein, lave-glace, etc.), actuellement disposés sans système de rétention ni récupération des égouttures.
      La gestion des déchets, notamment le remplacement de la cuve de stockage des huiles usagées, obsolète et non conforme.
      Ces travaux, bien que nécessaires pour respecter les normes environnementales et éviter des pénalités (20 €/jour de retard par non-conformité), représentent un investissement lourd pour notre entreprise.
      Pour répondre à ces exigences, nous avons sollicité un devis auprès d’une société, qui s’élève à 30 994,80 € TTC.
      Ce montant couvre :
      L’installation d’un séparateur à hydrocarbures conforme (7 300 € HT).
      Les travaux de terrassement, raccordement et mise aux normes du réseau (16 523 € HT).
      La condamnation des anciens ouvrages non conformes et le curage des réseaux (6 320 € HT).
      Conscients de l’importance de ces travaux pour la protection de l’environnement et la conformité de notre activité, nous souhaitons solliciter votre soutien financier dans le cadre des dispositifs d’aides aux entreprises que vous proposez en matière de protection de l’environnement.
      Pourriez-vous nous accompagner dans ce projet ? Sous quelle forme ?
      Vous trouverez en PJ le détail du projet et notre situation actuelle.
      Nous vous remercions par avance de l’attention portée à notre demande.
      Veuillez agréer, Madame, Monsieur, nos salutations distinguées.
  - title: Livraison et impression - Consommation d’eau potable
    text: |-
      Bonjour,
      Je souhaite échanger avec vous concernant 2 activités :
      La première :
      - Mon entreprise a une activité de ventes et de livraison de produits alimentaires pour chiens et chats.
      J’ai donc des déchets (cartons, plastiques, à recycler dans le cadre de cette activité).
      Et je roule énormément pour les livraisons avec un véhicule thermique, alors que j’essaie de mutualiser les livraisons dans des secteurs où je roule parfois beaucoup en centre-ville.
      La deuxième :
      - Mon entreprise a une activité d’impression, de distribution et de diffusion de documents.
      J’ai donc des déchets (cartons, plastiques, papiers à recycler dans le cadre de cette activité).
      Je roule énormément pour mon activité avec un véhicule thermique.
      Actuellement, j’utilise beaucoup d’eau dans le cadre de l’affichage des documents et également pour nettoyer le matériel. Je souhaiterais ne plus avoir à consommer de l’eau potable pour cela.
      J’ai pour projet de démarrer une transition écologique et RSE dans le cadre de mes activités.
      J’ai besoin d’être accompagné(e) sur la réflexion stratégique concernant la démarche RSE de ma société, sur la manière de réduire l’empreinte carbone de mes activités, réduire la consommation d’eau potable, recycler ou réemployer mes déchets, mieux maîtriser mes achats, afin qu’ils soient plus durables ou réparables, privilégier les mobilités douces lorsque cela est possible.
      Merci d’avance pour votre appel.
  - title: Entretien automobile - Lavage en circuit fermé
    text: |-
      Bonjour,
      Mon entreprise a une activité d’entretien et réparation de véhicules automobiles légers.
      Actuellement, j’utilise de l’eau pour laver les véhicules.
      J’ai pour projet de monter un système en circuit fermé.
      J’ai besoin d’être accompagné(e) sur les subventions possibles.
      Merci d’avance pour votre appel.
