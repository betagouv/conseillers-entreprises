bilan-rse:
  cases:
  - title: Fabrication de mobiliers d’agencement - Bilan Carbone
    text: |-
      Bonjour,
      Mon entreprise a une activité de fabricant de mobiliers d’agencement.
      Le but de notre démarche RSE est d’améliorer notre impact environnemental et d’aller vers une certification EcoVadis.
      J’ai besoin d’être accompagné(e) sur le calcul de mon Bilan Carbone.
      Merci d’avance pour votre appel.
  - title: Association festival - Financements de l’Ademe
    text: |-
      Bonjour,
      Je vous contacte au sujet des financements de l’Ademe concernant le dispositif « Contribuez à faire évoluer les mentalités et les comportements en faveur de la transition écologique ».
      Je suis trésorière d’une association ayant pour vocation de réaliser un festival de construction de petites architectures en matériaux biosourcés et géosourcés en juillet 2027, mettant en lumière le patrimoine architectural, culturel et paysager vendéen. Le festival se composerait de 5 jours de construction encadrés par des professionnels de la construction et de 2 jours de festivités ouvertes au public, proposant notamment des ateliers, des conférences et un concert le samedi soir.
      L’association est aujourd’hui en recherche de soutien financier afin de concrétiser ce projet ; et il me semble que nous pourrions être éligibles au financement du dispositif « Contribuez à faire évoluer les mentalités et les comportements en faveur de la transition écologique ».
      Pourriez-vous nous indiquer, s’il vous plaît, si l’association serait en effet bien éligible à ce financement avant que nous réalisions le dossier ?
      N’hésitez pas à revenir vers moi pour toute information sur le festival, je serai ravie d’échanger avec vous à ce sujet.
      En vous remerciant par avance et en vous souhaitant une bonne journée,
      Bien cordialement,
  - title: Formation et conseil - Démarche RSE d’une très petite structure
    text: |-
      Bonjour,
      Mon entreprise a une activité de formation et de conseil à destination des personnels du secteur public.
      Le but de notre démarche RSE est d’améliorer nos pratiques internes et de réduire notre impact environnemental en prenant soin du bien-être de nos collaborateurs-trices et en favorisant des approches non-excluantes dans nos pratiques internes et de formation.
      J’ai besoin d’être accompagné(e) sur les référentiels, la documentation et le suivi des démarches mises en œuvre pour trouver comment adapter ces démarches à une très petite structure sans impacter la qualité de vie au travail de mes collaborateurs-trices.
      Merci d’avance pour votre appel.
  solutions: diagnostic, conseils, rendez-vous personnalisé...
  title: Exemples d’entreprises accompagnées par le service sur leur bilan et leur stratégie RSE
dechets:
  cases:
  - title: Supermarchés - Réduire et recycler les emballages
    text: |-
      Bonjour,
      Mon entreprise a une activité de type « Supermarchés ».
      J’ai pour projet de réduire et recycler les emballages de mon activité.
      J’aimerais être accompagnée pour vérifier l’éligibilité de votre projet et être conseillée sur les infrastructures les mieux adaptées à ma situation.
      Merci d’avance pour votre appel.
  - title: Pépinière - Valorisation des déchets végétaux
    text: |-
      Objet : PROJET DE VALORISATION DES DÉCHETS VÉGÉTAUX – INVESTISSEMENT DE 100 000 € HT – RECHERCHE DE FINANCEMENT
      Madame, Monsieur,
      Dirigeant d’une pépinière, nous souhaitons aujourd’hui engager un projet écologique important pour faire évoluer notre manière de gérer et valoriser nos déchets végétaux.
      Avec la culture pépinière et l’activité espace vert, notre entreprise génère chaque année une quantité importante de déchets verts, provenant de la taille, l’élagage, le désherbage, la tonte et le débroussaillage que nous évacuons des différents chantiers. Jusqu’à présent, ces végétaux sont principalement considérés comme des déchets à évacuer. Nous souhaitons, aujourd’hui, franchir une nouvelle étape en les transformant en une véritable ressource locale, utile à toutes plantations et tendre vers une culture plus autonome et circulaire.
      En pépinière nous cultivons des arbres depuis 75 ans. La demande d’arbres est très forte. Nous tenons à améliorer notre culture locale et faire face aux aléas climatiques importants.
      Dans ce cadre, nous souhaitons faire l’achat d’un broyeur-mélangeur. Cette machine permet de recycler les déchets verts afin de les transformer et de les réutiliser dans une démarche éco-responsable.
      Notre objectif : passer d’une logique d’évacuation à une logique de valorisation.
      - Valoriser les déchets verts directement sur site,
      - Transformer les branches en paillage,
      - Transformer les déchets verts en compost,
      - Utiliser le compost pour les plantations,
      - Utiliser le broyage pour pailler les végétaux,
      - Limiter l’évaporation de l’eau et l’érosion,
      - Réduire l’arrosage,
      - Faire face à la sécheresse,
      - Enrichir le sol avec le compost,
      - Réduire les coûts d’évacuation et de transports,
      - Préserver la vie dans le sol,
      - Diminuer la consommation de matière première extérieure,
      - Favoriser la réutilisation locale des ressources produites sur notre site.
      Le recyclage des végétaux sera proposé aux différents paysagistes et collectivités territoriales qui en auraient besoin. Nous serons moteur dans cette démarche, nous sensibiliserons les professionnels et les particuliers dans la réutilisation des déchets verts.
      Le montant de l’investissement est de 100 000 € HT.
      Compte tenu du montant significatif de cet investissement, nous souhaitons étudier les dispositifs d’aides publiques susceptibles d’accompagner ce projet.
      Nous souhaitons donc pouvoir échanger avec vos services afin de déterminer les dispositifs auxquels notre entreprise pourrait être éligible.
      Nous sommes bien entendu en mesure de vous transmettre le devis du matériel et les caractéristiques techniques du broyeur-mélangeur.
      Nous sommes convaincus que ce type d’investissement peut contribuer à faire évoluer les pratiques des valorisations des végétaux et à donner une seconde vie à une ressource, aujourd’hui, considérée comme un déchet.
      Nous vous remercions par avance de votre retour, et restons à votre disposition pour convenir d’un rendez-vous.
      Cordialement,
  - title: Vente de matériel informatique - Évacuation des déchets
    text: |-
      Bonjour,
      Mon entreprise a une activité de vente de matériel informatique.
      J’ai pour projet d’évacuer les déchets et pourquoi pas les valoriser.
      J’ai besoin d’être accompagné(e) sur quelle entreprise peut venir chercher mes déchets et les trier/valoriser.
      Merci d’avance pour votre appel.
  solutions: diagnostic, conseils, rendez-vous personnalisé, aide financière...
  title: Exemples d’entreprises accompagnées par le service sur la réduction et la valorisation de leurs déchets
