    text: Dans le cadre d’une liquidation amiable d’une SA d’activité juridique, nous avons besoin de confirmations pour la fiscalité concernant la distribution du capital et du boni de liquidation.
  - title: Agricole - Taxation des plus-values de cession
    text: |-
      Bonjour,
      Mon entreprise a une activité agricole.
