    text: |-
      Bonjour,
      J’ai besoin de changer le véhicule de mon commercial, choix d’un véhicule électrique, véhicule société.
      Et de changer mon utilitaire, choix du véhicule encore non arrêté.
      Mon entreprise a une activité de type « Restauration et création de vitraux, verres gravés ».
