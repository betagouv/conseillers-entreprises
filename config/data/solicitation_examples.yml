      Merci d’avance pour votre appel.
  - title: Ingénierie - Fiscalité des dividendes / Flat tax
    text: |-
      Bonjour,
      Mon entreprise a une activité d’ingénierie.
      Elle existe depuis 2021.
      Je souhaiterais des conseils sur les différentes cotisations et impôts sur les dividendes distribués dans le but de choisir la flat tax ou l’impôt au barème.
      Merci d’avance pour votre appel.
      Cordialement
  - title: Fabrication de bocaux de condiments - Augmentation du capital / compte courant d’associé
    text: |-
      Bonjour,
      Mon entreprise a une activité de fabrication et de vente de bocaux de condiments.
      Elle existe depuis 2023.
      Je souhaiterais des conseils sur une augmentation de capital par incorporation du compte courant d’associé, car la perte 2024 est supérieure à la moitié des capitaux propres.
      Merci d’avance pour votre appel.
  - title: Vente de luminaires - Réduction d’impôt pour souscription au capital (IR-PME)
    text: |-
      Bonjour,
      Mon entreprise a une activité de vente de luminaires.
      Elle existe depuis 2017.
      J’ai acquis 10 % des parts en 2019, puis 20 % supplémentaires (pour un total de 30 %) en mai 2022. J’ai bénéficié du dispositif « Réduction d’impôt (IR-PME) pour souscription au capital d’une société ».
      Un repreneur souhaite racheter la totalité des parts de l’entreprise en octobre 2026, dont mes 20 % qui n’auront pas été conservés pendant 5 ans. Devrais-je rembourser la totalité du crédit d’impôt qui m’a été accordé en 2022 ou uniquement une partie ?
      Merci d’avance pour votre appel.
  - title: Informatique - Jeune entreprise innovante / crédit d’impôt
    text: |-
      Bonjour,
      Je viens de créer une société d’informatique, en lui apportant un capital de 100 000 €. Elle me semble éligible au dispositif JEIR, et je suis en train de terminer une demande de rescrit fiscal sur cette qualification.
      En tant que personne physique qui a investi dans cette société, je souhaite bénéficier du crédit d’impôt correspondant. J’ai vu qu’il faut accompagner ma déclaration IRPP d’un état individuel, sur lequel j’aimerais des précisions. Pourrions-nous en parler ?
      Merci
  - title: Restauration rapide à emporter - Crédit d’impôt pour souscription au capital
    text: |-
      Bonjour,
      Mon entreprise a une activité de restauration rapide à emporter.
      Elle existe depuis début 2024.
      Je souhaiterais des conseils sur la déduction fiscale sur la création d’entreprise, avec un capital de 10 000 € et 60 % des parts en ma détention.
      Merci d’avance pour votre appel.
  - title: Conception de machines-outils - Apports en nature
    text: |-
      Bonjour,
      Mon entreprise a une activité de conception et réalisation de machines-outils APE 28.99 B.
      Elle existe depuis 2023.
      Je souhaiterais des conseils sur les apports en nature.
      Merci d’avance pour votre appel.
  - title: Maîtrise d’œuvre - TVA applicable
    text: |-
      Bonjour,
      Mon entreprise a une activité de maîtrise d’œuvre.
      Elle existe depuis septembre 2023.
      Je souhaiterais des conseils sur les taux de TVA applicables en fonction de la nature des travaux.
      Merci d’avance pour votre appel.
  - title: Bâtiment gros œuvre - Suramortissement fiscal
    text: |-
      Bonjour,
      Mon entreprise a une activité de gros œuvre.
      Elle existe depuis 2005.
      Je souhaiterais des conseils sur le suramortissement fiscal pour l’achat d’une mini-pelle.
      Merci d’avance pour votre appel.
