      Merci d’avance pour votre appel.
  - title: Recherche essais cliniques - Crédit d’impôt recherche (CIR)
    text: |-
      Bonjour,
      Notre société conduit des essais cliniques de phases 1 à 3.
      Nous nous demandions si le poste d’attaché de recherche clinique est éligible au crédit d’impôt recherche (CIR).
      Je comprends que certaines activités telles que : participation à la mise en place technique du protocole expérimental, recueil, contrôle de cohérence scientifique et assurance qualité des données médicales brutes (CRF), suivi technique de l’application stricte du protocole auprès des investigateurs, seraient éligibles. En revanche, des tâches telles que les visites de faisabilité et clôture de centres et les tâches administratives ne sont pas éligibles.
      Pourriez-vous svp m’éclairer sur les tâches d’ARC éligibles au CIR ?
      Merci beaucoup.
      Cordialement
  - title: Graphisme - Crédit d’impôt achat d’œuvre d’art
    text: |-
      Bonjour,
      Mon entreprise a une activité de graphisme et illustration, je souhaite réaliser des fresques murales pour les entreprises.
      Je souhaiterais des conseils sur le dispositif qui consiste à déduire fiscalement l’achat d’une œuvre d’art. Je voudrais savoir, si je réalise une fresque murale chez certains de mes clients (entreprises), s’ils peuvent bien bénéficier de ce dispositif de déduction fiscale qui s’effectue sur 5 ans.
      Est-ce que les démarches sont faciles pour eux ? La facture suffit-elle ou faut-il fournir un autre document ?
