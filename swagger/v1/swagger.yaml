---
openapi: 3.1.1
info:
  title: API Service Public Conseillers entreprises V1
  description: "## Bienvenue sur la documentation de l’API de conseillers-entreprises.service-public.gouv.fr\n
    \       \nCette API permet à une organisation de proposer un formulaire de dépôt
    de besoin d'entreprise connecté à Conseillers-entreprises.service-public.gouv.fr
    sur son propre site internet.\n        \nConcrètement, cette API permet de :\n
    \       \n- récupérer la liste des pages d'atterrissage, thèmes et sujets autorisés
    pour l'organisation concernée,\n        \n- d'envoyer à Conseillers-entreprises.service-public.gouv.fr
    un besoin\n        \n### Limite des requêtes\n        \nLe serveur accepte un
    maximum de 300 appels par 5 minutes.\n        "
  version: 1.0.0
  contact:
    name: Équipe technique
    email: tech@entreprises.service-public.gouv.fr
tags:
- name: Page d’atterrissage
- name: Sujets d’atterrissage
- name: Thèmes
- name: Sujets
paths:
  "/api/v1/landings/{landing_id}/landing_subjects":
    get:
      summary: Liste des sujets d’atterrissage
      tags:
      - Sujets d’atterrissage
      description: Affiche tous les sujets d’une page d’atterrissage
      operationId: listLandingSubjects
      parameters:
      - name: landing_id
        in: path
        description: identifiant de la page d’atterrissage
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/landing_subject"
                  metadata:
                    type: object
                    properties:
                      total_results:
                        type: integer
                        description: Nombre de sujets de la page d’atterrissage.
  "/api/v1/landings/{landing_id}/landing_subjects/search":
    get:
      summary: Recherche d’un sujet à partir de son slug
      tags:
      - Sujets d’atterrissage
      description: Recherche d’un sujet à partir de son slug, équivalent à un mot
        clé, pour faciliter la récupération d’un sujet spécifique.
      operationId: searchLandingSubject
      parameters:
      - name: landing_id
        in: path
        description: identifiant de la page d’atterrissage
        required: true
        schema:
          type: integer
      - name: slug
        in: query
        description: Slug du sujet
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Sujet trouvé
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/landing_subject"
                  metadata:
                    type: object
        '404':
          description: Page d’atterrissage inconnue
          content:
            application/json:
              schema:
                errors:
                  type: array
                  items:
                    "$ref": "#/components/schemas/error"
        '400':
          description: Paramètres vides
          content:
            application/json:
              schema:
                errors:
                  type: array
                  items:
                    "$ref": "#/components/schemas/error"
  "/api/v1/landings/{landing_id}/landing_subjects/{id}":
    get:
      summary: Page sujet
      tags:
      - Sujets d’atterrissage
      description: Affiche le détail d’un formulaire sujet
      operationId: showLandingSubject
      parameters:
      - name: landing_id
        in: path
        description: identifiant de la page d’atterrissage
        required: true
        schema:
          type: integer
      - name: id
        in: path
        description: identifiant du sujet
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Sujet trouvé
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/landing_subject"
                  metadata:
                    type: object
  "/api/v1/landings/{landing_id}/landing_themes":
    get:
      summary: Liste des thèmes
      tags:
      - Thèmes
      description: Affiche tous les thèmes pour l’organisation authentifiée
      operationId: listLandingThemes
      parameters:
      - name: landing_id
        in: path
        description: identifiant de la page d’atterrissage
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/landing_theme"
                  metadata:
                    type: object
                    properties:
                      total_results:
                        type: integer
                        description: Nombre de thèmes pour l’organisation authentifiée.
  "/api/v1/landings/{landing_id}/landing_themes/{id}":
    get:
      summary: Page thème
      tags:
      - Thèmes
      description: Affiche le détail d’un thème et la liste de ses sujets
      operationId: showLandingTheme
      parameters:
      - name: landing_id
        in: path
        description: identifiant de la page d’atterrissage
        required: true
        schema:
          type: integer
      - name: id
        in: path
        description: identifiant du thème
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Page thème trouvée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/landing_theme"
                  metadata:
                    type: object
                    properties:
                      total_themes:
                        type: integer
                        description: Nombre de sujets liés aux thèmes.
  "/api/v1/landings":
    get:
      summary: Liste des pages d’atterrissage
      tags:
      - Page d’atterrissage
      description: Affiche toutes les pages d’atterrissage pour l’organisation authentifiée
      operationId: listLandings
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/landing"
                  metadata:
                    type: object
                    properties:
                      total_results:
                        type: integer
                        description: Nombre de pages d’atterrissage pour l’organisation
                          authentifiée.
        '404':
          description: Mauvais token
          content:
            application/json:
              schema:
                errors:
                  type: array
                  items:
                    "$ref": "#/components/schemas/error"
  "/api/v1/landings/search":
    get:
      summary: Recherche d’une page d’atterrissage à partir de l’url de sa page d’appel
      tags:
      - Page d’atterrissage
      description: Afin de pouvoir tracer et quantifier les appels, nous enregistrons
        les url des pages des sites partenaires depuis lesquelles l’API est appelé.
        Ainsi, pour retrouver la page d’atterrissage devant figurer à l’url XX, vous
        pouvez faire une recherche via cette url.
      operationId: searchLandings
      parameters:
      - name: url
        in: query
        description: Domaine du site qui appelle l’API
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Pages d’atterrissage trouvées
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/landing"
                  metadata:
                    type: object
                    properties:
                      total_results:
                        type: integer
                        description: Nombre de pages d’atterrissage pour l’organisation
                          authentifiée.
        '404':
          description: Page d’atterrissage inconnue
          content:
            application/json:
              schema:
                errors:
                  type: array
                  items:
                    "$ref": "#/components/schemas/error"
        '400':
          description: Paramètres vides
          content:
            application/json:
              schema:
                errors:
                  type: array
                  items:
                    "$ref": "#/components/schemas/error"
  "/api/v1/landings/{id}":
    get:
      summary: Page d’atterrissage
      tags:
      - Page d’atterrissage
      description: Affiche le détail d’une page d’atterrissage et la liste de ses
        thèmes
      operationId: showLanding
      parameters:
      - name: id
        in: path
        description: identifiant de la page
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Page d’atterrissage trouvée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/landing"
                  metadata:
                    type: object
                    properties:
                      total_themes:
                        type: integer
                        description: Nombre de thèmes liée à la page d’atterrissage.
  "/api/v1/qualifications":
    put:
      summary: Qualification des sollicitations
      tags:
      - Sollicitations
      description: Enregistre le verdict de qualification pour un lot de 100 sollicitations
        maximum.
      operationId: updateSolicitationsQualifications
      parameters: []
      responses:
        '204':
          description: Toutes les qualifications ont été prises en compte
          headers:
            X-Call-Id:
              schema:
                type: string
              description: Identifiant de corrélation de l’appel, à fournir lors d’une
                investigation.
        '207':
          description: Erreur partielle
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/qualification_result"
        '400':
          description: Format de requête invalide
          content:
            application/json:
              schema:
                errors:
                  type: array
                  items:
                    "$ref": "#/components/schemas/error"
        '403':
          description: Token sans le scope de qualification
          content:
            application/json:
              schema:
                errors:
                  type: array
                  items:
                    "$ref": "#/components/schemas/error"
        '404':
          description: Mauvais token
          content:
            application/json:
              schema:
                errors:
                  type: array
                  items:
                    "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  qualified:
                    type: boolean
                  details:
                    type: string
                    description: Motif, attendu lorsque la sollicitation est rejetée.
                required:
                - id
                - qualified
  "/api/v1/qualifications/unqualified":
    get:
      summary: Liste des sollicitations non qualifiées
      tags:
      - Sollicitations
      description: Affiche les sollicitations en cours de traitement dont la qualification
        n’a pas encore été renseignée.
      operationId: listUnqualifiedSolicitations
      parameters:
      - name: page
        in: query
        required: false
        description: Numéro de page (défaut 1).
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: Nombre de résultats par page (défaut 100, maximum 1000).
        schema:
          type: integer
      responses:
        '200':
          description: ok
          headers:
            X-Call-Id:
              schema:
                type: string
              description: Identifiant de corrélation de l’appel, à fournir lors d’une
                investigation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/unqualified_solicitation"
                  metadata:
                    type: object
                    properties:
                      total_results:
                        type: integer
                        description: Nombre total de sollicitations non qualifiées.
        '403':
          description: Token sans le scope de qualification
          content:
            application/json:
              schema:
                errors:
                  type: array
                  items:
                    "$ref": "#/components/schemas/error"
        '404':
          description: Mauvais token
          content:
            application/json:
              schema:
                errors:
                  type: array
                  items:
                    "$ref": "#/components/schemas/error"
  "/api/v1/solicitations":
    post:
      summary: Créer une sollicitation
      tags:
      - Sollicitation
      description: Crée une sollicitation liée à un sujet, en provenance d’une institution.
      operationId: createSolicitation
      parameters: []
      responses:
        '200':
          description: Solicitation créée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/solicitation_created"
        '400':
          description: Paramètre "Solicitation" manquant
          content:
            application/json:
              schema:
                errors:
                  type: array
                  items:
                    "$ref": "#/components/schemas/error"
        '422':
          description: Page introuvable
          content:
            application/json:
              schema:
                errors:
                  type: array
                  items:
                    "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/new_solicitation"
        required: true
  "/api/v1/subjects":
    get:
      summary: Liste des sujets
      tags:
      - Sujets
      description: Affiche tous les sujets de besoins ainsi que les sujets d’atterrissage
        associés.
      operationId: listSubjects
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/subject"
                  metadata:
                    type: object
                    properties:
                      total_results:
                        type: integer
                        description: Nombre de sujets.
        '404':
          description: Mauvais token
          content:
            application/json:
              schema:
                errors:
                  type: array
                  items:
                    "$ref": "#/components/schemas/error"
servers:
- url: https://conseillers-entreprises.service-public.gouv.fr
- url: https://staging.conseillers-entreprises.service-public.gouv.fr
- url: https://localhost:3000
components:
  schemas:
    landing:
      type: object
      properties:
        id:
          type: integer
        iframe_category:
          type: string
        title:
          type: string
        slug:
          type: string
        partner_url:
          type: string
        landing_themes:
          type: array
          items:
            "$ref": "#/components/schemas/landing_theme"
      required:
      - id
      - title
      - partner_url
    landing_theme:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        landing_subjects:
          type: array
          items:
            "$ref": "#/components/schemas/landing_subject"
      required:
      - id
      - title
    landing_subject:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        description_explanation:
          type: string
        requires_siret:
          type: boolean
        requires_location:
          type: boolean
        landing_subjects:
          type: array
          items:
            "$ref": "#/components/schemas/landing_subject"
      required:
      - id
      - title
      - slug
    subject:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
        slug:
          type: string
        can_be_automated:
          type: boolean
        landing_subjects:
          type: array
          items:
            "$ref": "#/components/schemas/landing_subject"
      required:
      - id
      - label
      - slug
    new_solicitation:
      type: object
      properties:
        solicitation:
          type: object
          properties:
            landing_id:
              type: integer
            landing_subject_id:
              type: integer
            description:
              type: string
            full_name:
              type: string
            email:
              type: string
            phone_number:
              type: string
            siret:
              type: string
            location:
              type: string
            origin_url:
              type: string
            questions_additionnelles:
              type: array
              items:
                "$ref": "#/components/schemas/question_additionnelle_short"
          required:
          - landing_id
          - landing_subject_id
          - description
          - full_name
          - email
          - origin_url
      required:
      - solicitation
    solicitation_created:
      type: object
      properties:
        uuid:
          type: string
        landing_subject:
          type: string
        full_name:
          type: string
        email:
          type: string
        phone_number:
          type: string
        siret:
          type: string
        location:
          type: string
        description:
          type: string
        code_region:
          type: integer
        status:
          type: string
        questions_additionnelles:
          type: array
          items:
            "$ref": "#/components/schemas/question_additionnelle_long"
        origin_url:
          type: string
      required:
      - landing_id
      - landing_subject_id
      - description
      - full_name
      - email
      - origin_url
    question_additionnelle_short:
      type: object
      properties:
        question_id:
          type: integer
        answer:
          type: boolean
    question_additionnelle_long:
      type: object
      properties:
        question_id:
          type: integer
        question_label:
          type: string
        answer:
          type: boolean
    unqualified_solicitation:
      type: object
      properties:
        id:
          type: integer
        subject:
          type:
          - integer
          - 'null'
          description: Identifiant du sujet retenu pour la mise en relation, null
            pour les sollicitations antérieures à novembre 2020 qui n’en ont pas.
        description:
          type: string
          description: Description saisie par l’entreprise.
      required:
      - id
      - subject
      - description
    qualification_result:
      type: object
      properties:
        id:
          type: integer
        status:
          type: integer
          description: Statut de prise en compte de la qualification (200 ou 400).
        message:
          type: string
          description: Motif du rejet, présent uniquement lorsque le statut est 400.
      required:
      - id
      - status
    error:
      type: object
      properties:
        source:
          type: string
        message:
          type: string
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: "Le jeton vous est fourni après étude de votre demande par Conseillers-entreprises.service-public.gouv.fr.\n
        \           \nIl doit être placé dans le header '`Authorization: Bearer VOTRE_JETON`'.\n
        \           \nSa validité est de 18 mois, renouvelable sur demande."
security:
- bearer_auth: []
